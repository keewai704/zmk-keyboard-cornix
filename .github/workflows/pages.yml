name: Validate GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "scripts/check-pages.py"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "scripts/check-pages.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: python3 scripts/check-pages.py

# Upstream includes an automatic GitHub Pages deploy job, but this fork does
# not currently have Pages enabled. actions/configure-pages cannot create the
# Pages site with the repository GITHUB_TOKEN ("Resource not accessible by
# integration"), so deployment is intentionally omitted here. Once Pages is
# enabled manually in Settings > Pages with Source = GitHub Actions, the
# upstream deploy job can be restored without affecting the firmware build.
